<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#111111"/>
  <!-- Sticker 1: Arc arch -->
  <g transform="translate(150, 150)">
    <rect width="160" height="160" rx="20" fill="#1A1A1A" stroke="#333" stroke-width="1"/>
    <path d="M80 40 C50 40 30 60 30 90 L45 90 C45 68 60 55 80 55 C100 55 115 68 115 90 L130 90 C130 60 110 40 80 40Z" fill="white" transform="translate(0,20)"/>
  </g>
  <!-- Sticker 2: USDC -->
  <g transform="translate(350, 120)">
    <rect width="140" height="140" rx="70" fill="#1A1A1A" stroke="#2775CA" stroke-width="2"/>
    <text x="70" y="78" text-anchor="middle" fill="#2775CA" font-family="sans-serif" font-size="36" font-weight="bold">$</text>
  </g>
  <!-- Sticker 3: ArcMerch -->
  <g transform="translate(530, 180)">
    <rect width="150" height="150" rx="15" fill="#1A1A1A" stroke="#E9A13F" stroke-width="2"/>
    <text x="75" y="70" text-anchor="middle" fill="#E9A13F" font-family="monospace" font-size="11">{ARC</text>
    <text x="75" y="90" text-anchor="middle" fill="#E9A13F" font-family="monospace" font-size="11">MERCH}</text>
  </g>
  <!-- Sticker 4: Build on Arc -->
  <g transform="translate(200, 350)">
    <rect width="180" height="80" rx="12" fill="#1A1A1A" stroke="#E9A13F" stroke-width="1.5"/>
    <text x="90" y="48" text-anchor="middle" fill="white" font-family="monospace" font-size="13">BUILD ON ARC</text>
  </g>
  <!-- Sticker 5: Circle ring -->
  <g transform="translate(430, 360)">
    <circle cx="60" cy="50" r="45" fill="#1A1A1A" stroke="#333" stroke-width="1"/>
    <circle cx="60" cy="50" r="30" fill="none" stroke="white" stroke-width="4"/>
    <circle cx="60" cy="50" r="20" fill="none" stroke="white" stroke-width="2"/>
  </g>
  <!-- Label -->
  <text x="400" y="560" text-anchor="middle" fill="#E9A13F" font-family="monospace" font-size="12" opacity="0.6">ARC ICON STICKER PACK — 5 PCS</text>
</svg>