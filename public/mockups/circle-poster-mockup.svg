<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#0D0A15"/>
  <!-- Frame -->
  <rect x="180" y="60" width="440" height="480" rx="4" fill="#1A1030" stroke="#3D3055" stroke-width="2"/>
  <!-- Inner border -->
  <rect x="200" y="80" width="400" height="440" fill="#120D20"/>
  <!-- Circle logo large -->
  <circle cx="400" cy="250" r="80" fill="none" stroke="white" stroke-width="5"/>
  <circle cx="400" cy="250" r="55" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Text -->
  <text x="400" y="380" text-anchor="middle" fill="white" font-family="sans-serif" font-size="24" font-weight="300" letter-spacing="4">CIRCLE</text>
  <text x="400" y="415" text-anchor="middle" fill="#AAA" font-family="sans-serif" font-size="13" letter-spacing="2">THE FULL-STACK PLATFORM</text>
  <text x="400" y="445" text-anchor="middle" fill="#666" font-family="monospace" font-size="11">INTERNET FINANCIAL SYSTEM</text>
  <!-- Arc badge -->
  <rect x="340" y="460" width="120" height="30" rx="4" fill="none" stroke="#E9A13F" stroke-width="1"/>
  <text x="400" y="480" text-anchor="middle" fill="#E9A13F" font-family="monospace" font-size="10">BUILT ON ARC</text>
  <!-- Label -->
  <text x="400" y="570" text-anchor="middle" fill="#E9A13F" font-family="monospace" font-size="12" opacity="0.6">CIRCLE PAYMENTS POSTER — A3 MATTE</text>
</svg>